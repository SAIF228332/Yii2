<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Новое сообщение — MessageBox</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
    <aside class="sidebar">
        <div class="logo"><div class="logo-mark">M</div> MessageBox</div>
        <div class="nav-title">Меню</div>
        <nav class="nav">
            <a href="index.html">⌂ &nbsp; Личный кабинет</a>
            <a href="messages.html">✉ &nbsp; Сообщения</a>
            <a class="active" href="send-message.html">＋ &nbsp; Новое сообщение</a>
            <a href="statistics.html">▥ &nbsp; Статистика</a>
        </nav>
        <div class="user-mini"><div class="avatar">А</div><div><strong>Алексей Иванов</strong><span>alex@example.com</span></div></div>
    </aside>

    <main class="main">
        <header class="header">
            <div><h1>Новое сообщение</h1><p>Заполните форму, чтобы отправить сообщение.</p></div>
        </header>

        <section class="card form-card">
            <form action="#" method="post">
                <div class="form-group">
                    <label for="recipient">Получатель</label>
                    <input id="recipient" type="email" placeholder="example@mail.ru" required>
                </div>
                <div class="form-group">
                    <label for="subject">Тема</label>
                    <input id="subject" type="text" placeholder="Введите тему сообщения" required>
                </div>
                <div class="form-group">
                    <label for="message">Сообщение</label>
                    <textarea id="message" placeholder="Введите текст сообщения..." required></textarea>
                </div>
                <div class="form-actions">
                    <a class="btn btn-secondary" href="messages.html">Отмена</a>
                    <button class="btn" type="submit">Отправить сообщение</button>
                </div>
            </form>
        </section>
    </main>
</div>
</body>
</html>
